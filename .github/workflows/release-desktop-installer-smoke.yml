name: "Desktop Installer/Update Smoke"

on:
  workflow_dispatch:
    inputs:
      rc_id:
        description: "Release candidate identifier"
        type: string
        required: true
        default: RC-DRAFT
      enforce_signing_readiness:
        description: "Fail workflow when signing prerequisites are missing"
        type: boolean
        required: true
        default: false
      enforce_signing_execution:
        description: "Fail workflow when signing/notarization execution is incomplete"
        type: boolean
        required: true
        default: false
      enforce_signing_provenance:
        description: "Fail workflow when signing provenance verification is incomplete"
        type: boolean
        required: true
        default: false
      enforce_signing_command_hooks:
        description: "Fail workflow when signing command hooks are missing"
        type: boolean
        required: true
        default: false
      enforce_signing_placeholder_hygiene:
        description: "Fail workflow when signing readiness inputs contain placeholder/dummy values"
        type: boolean
        required: true
        default: false
      publish_appcast_external:
        description: "Run external appcast publication stage"
        type: boolean
        required: true
        default: false
      enforce_appcast_external_readiness:
        description: "Fail workflow when external appcast publication readiness checks fail"
        type: boolean
        required: true
        default: false
      appcast_external_provider:
        description: "External publication provider"
        type: choice
        required: true
        default: none
        options:
          - none
          - s3
      appcast_external_dry_run:
        description: "Execute external publication in dry-run mode"
        type: boolean
        required: true
        default: true
      allow_appcast_external_production:
        description: "Allow non-dry-run external appcast publication"
        type: boolean
        required: true
        default: false
      enforce_windows_installer_packaging:
        description: "Fail workflow when Windows installer (.msi/.exe) artifact check fails"
        type: boolean
        required: true
        default: false
      enforce_windows_installer_execution:
        description: "Fail workflow when Windows installer generation command is missing/fails"
        type: boolean
        required: true
        default: false
      enforce_windows_installer_naming:
        description: "Fail workflow when Windows installer naming policy check fails"
        type: boolean
        required: true
        default: false
      enforce_windows_installer_provenance:
        description: "Fail workflow when Windows installer provenance validation is incomplete"
        type: boolean
        required: true
        default: false
      enforce_windows_protocol_registration:
        description: "Fail workflow when Windows protocol registration command is missing/fails"
        type: boolean
        required: true
        default: false
      enforce_release_evidence_bundle:
        description: "Fail workflow when release evidence bundle check reports risky statuses"
        type: boolean
        required: true
        default: false
      build_mode:
        description: "Build mode for smoke packaging"
        type: choice
        required: true
        default: release
        options:
          - release
          - debug

concurrency:
  group: desktop-installer-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signing-readiness:
    name: "Signing Readiness"
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run release script syntax check
        working-directory: ./desktop
        run: ./scripts/check_release_script_syntax.sh

      - name: Run release script syntax contract check
        working-directory: ./desktop
        run: ./scripts/check_release_script_syntax_contract.sh

      - name: Run verify test coverage check
        working-directory: ./desktop
        run: ./scripts/check_verify_test_coverage.sh

      - name: Run verify test coverage contract check
        working-directory: ./desktop
        run: ./scripts/check_verify_test_coverage_contract.sh

      - name: Run auth-store legacy decommission check
        working-directory: ./desktop
        env:
          STRICT_AUTH_STORE_LEGACY_DECOMMISSION: "1"
        run: ./scripts/check_auth_store_legacy_decommission.sh

      - name: Run auth-store legacy decommission contract check
        working-directory: ./desktop
        run: ./scripts/check_auth_store_legacy_decommission_contract.sh

      - name: Run auth-store runtime decommission check
        working-directory: ./desktop
        run: ./scripts/check_auth_store_runtime_decommission.sh

      - name: Run auth-store runtime decommission contract check
        working-directory: ./desktop
        run: ./scripts/check_auth_store_runtime_decommission_contract.sh

      - name: Run desktop command inventory check
        working-directory: ./desktop
        run: ./scripts/check_desktop_command_inventory.sh

      - name: Run desktop command inventory contract check
        working-directory: ./desktop
        run: ./scripts/check_desktop_command_inventory_contract.sh

      - name: Run update manifest check
        working-directory: ./desktop
        run: ./scripts/check_update_manifest.sh

      - name: Run update manifest contract check
        working-directory: ./desktop
        run: ./scripts/check_update_manifest_contract.sh

      - name: Run release smoke gate policy check
        working-directory: ./desktop
        env:
          STRICT_SIGNING: ${{ inputs.enforce_signing_readiness }}
          STRICT_SIGNING_EXECUTION: ${{ inputs.enforce_signing_execution }}
          STRICT_SIGNING_COMMAND_HOOKS: ${{ inputs.enforce_signing_command_hooks }}
          STRICT_SIGNING_PLACEHOLDERS: ${{ inputs.enforce_signing_placeholder_hygiene }}
          STRICT_SIGNING_PROVENANCE: ${{ inputs.enforce_signing_provenance }}
          STRICT_WINDOWS_INSTALLER_EXECUTION: ${{ inputs.enforce_windows_installer_execution }}
          STRICT_WINDOWS_INSTALLER_PACKAGING: ${{ inputs.enforce_windows_installer_packaging }}
          STRICT_WINDOWS_INSTALLER_NAMING: ${{ inputs.enforce_windows_installer_naming }}
          STRICT_WINDOWS_INSTALLER_PROVENANCE: ${{ inputs.enforce_windows_installer_provenance }}
          STRICT_WINDOWS_PROTOCOL_REGISTRATION: ${{ inputs.enforce_windows_protocol_registration }}
          STRICT_RELEASE_EVIDENCE_BUNDLE: ${{ inputs.enforce_release_evidence_bundle }}
          PUBLISH_APPCAST_EXTERNAL: ${{ inputs.publish_appcast_external }}
          APPCAST_PUBLISH_PROVIDER: ${{ inputs.appcast_external_provider }}
          APPCAST_PUBLISH_DRY_RUN: ${{ inputs.appcast_external_dry_run }}
          ALLOW_APPCAST_EXTERNAL_PRODUCTION: ${{ inputs.allow_appcast_external_production }}
          STRICT_APPCAST_EXTERNAL_READINESS: ${{ inputs.enforce_appcast_external_readiness }}
        run: ./scripts/check_release_smoke_gate_policy.sh

      - name: Run release smoke gate policy contract check
        working-directory: ./desktop
        run: ./scripts/check_release_smoke_gate_policy_contract.sh

      - name: Run release evidence index check
        working-directory: ./desktop
        run: ./scripts/check_release_evidence_index.sh

      - name: Run release evidence index contract check
        working-directory: ./desktop
        run: ./scripts/check_release_evidence_index_contract.sh

      - name: Run signing readiness check
        working-directory: ./desktop
        env:
          STRICT_SIGNING: ${{ inputs.enforce_signing_readiness }}
          STRICT_SIGNING_COMMAND_HOOKS: ${{ inputs.enforce_signing_command_hooks }}
          STRICT_SIGNING_PLACEHOLDERS: ${{ inputs.enforce_signing_placeholder_hygiene }}
          STRICT_WINDOWS_PROTOCOL_REGISTRATION: ${{ inputs.enforce_windows_protocol_registration }}
          PENJAR_MACOS_SIGN_IDENTITY: ${{ secrets.PENJAR_MACOS_SIGN_IDENTITY }}
          PENJAR_MACOS_TEAM_ID: ${{ secrets.PENJAR_MACOS_TEAM_ID }}
          PENJAR_MACOS_NOTARY_PROFILE: ${{ secrets.PENJAR_MACOS_NOTARY_PROFILE }}
          PENJAR_WINDOWS_CERT_PATH: ${{ secrets.PENJAR_WINDOWS_CERT_PATH }}
          PENJAR_WINDOWS_CERT_PASSWORD: ${{ secrets.PENJAR_WINDOWS_CERT_PASSWORD }}
          PENJAR_MACOS_SIGN_COMMAND: ${{ secrets.PENJAR_MACOS_SIGN_COMMAND }}
          PENJAR_MACOS_NOTARIZE_COMMAND: ${{ secrets.PENJAR_MACOS_NOTARIZE_COMMAND }}
          PENJAR_WINDOWS_SIGN_COMMAND: ${{ secrets.PENJAR_WINDOWS_SIGN_COMMAND }}
          PENJAR_WINDOWS_INSTALLER_COMMAND: ${{ secrets.PENJAR_WINDOWS_INSTALLER_COMMAND }}
          PENJAR_MACOS_SIGN_VERIFY_COMMAND: ${{ secrets.PENJAR_MACOS_SIGN_VERIFY_COMMAND }}
          PENJAR_WINDOWS_SIGN_VERIFY_COMMAND: ${{ secrets.PENJAR_WINDOWS_SIGN_VERIFY_COMMAND }}
          PENJAR_WINDOWS_INSTALLER_PROVENANCE_COMMAND: ${{ secrets.PENJAR_WINDOWS_INSTALLER_PROVENANCE_COMMAND }}
          PENJAR_WINDOWS_PROTOCOL_REGISTER_COMMAND: ${{ secrets.PENJAR_WINDOWS_PROTOCOL_REGISTER_COMMAND }}
        run: ./scripts/check_signing_readiness.sh

      - name: Upload signing readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-signing-readiness-report
          path: desktop/release/reports/signing_readiness_report.md

      - name: Upload release smoke gate policy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-smoke-gate-policy-report
          path: desktop/release/reports/release_smoke_gate_policy_report.md
          if-no-files-found: warn

      - name: Upload release smoke gate policy contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-smoke-gate-policy-contract-report
          path: desktop/release/reports/release_smoke_gate_policy_contract_report.md
          if-no-files-found: warn

      - name: Upload release evidence index contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-evidence-index-contract-report-smoke
          path: desktop/release/reports/release_evidence_index_contract_report.md
          if-no-files-found: warn

      - name: Upload release evidence index check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-evidence-index-check-report-smoke
          path: desktop/release/reports/release_evidence_index_check_report.md
          if-no-files-found: warn

      - name: Upload release script syntax report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-script-syntax-report-smoke
          path: desktop/release/reports/release_script_syntax_report.md
          if-no-files-found: warn

      - name: Upload release script syntax contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-script-syntax-contract-report-smoke
          path: desktop/release/reports/release_script_syntax_contract_report.md
          if-no-files-found: warn

      - name: Upload verify test coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verify-test-coverage-report-smoke
          path: desktop/release/reports/verify_test_coverage_report.md
          if-no-files-found: warn

      - name: Upload verify test coverage contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verify-test-coverage-contract-report-smoke
          path: desktop/release/reports/verify_test_coverage_contract_report.md
          if-no-files-found: warn

      - name: Upload auth-store legacy decommission report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-auth-store-legacy-decommission-report-smoke
          path: desktop/release/reports/auth_store_legacy_decommission_report.md
          if-no-files-found: warn

      - name: Upload auth-store legacy decommission contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-auth-store-legacy-decommission-contract-report-smoke
          path: desktop/release/reports/auth_store_legacy_decommission_contract_report.md
          if-no-files-found: warn

      - name: Upload auth-store runtime decommission report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-auth-store-runtime-decommission-report-smoke
          path: desktop/release/reports/auth_store_runtime_decommission_report.md
          if-no-files-found: warn

      - name: Upload auth-store runtime decommission contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-auth-store-runtime-decommission-contract-report-smoke
          path: desktop/release/reports/auth_store_runtime_decommission_contract_report.md
          if-no-files-found: warn

      - name: Upload desktop command inventory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-command-inventory-report-smoke
          path: desktop/release/reports/desktop_command_inventory_report.md
          if-no-files-found: warn

      - name: Upload desktop command inventory contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-command-inventory-contract-report-smoke
          path: desktop/release/reports/desktop_command_inventory_contract_report.md
          if-no-files-found: warn

      - name: Upload update manifest validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-update-manifest-validation-report-smoke
          path: desktop/release/reports/update_manifest_validation_report.md
          if-no-files-found: warn

      - name: Upload update manifest contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-update-manifest-contract-report-smoke
          path: desktop/release/reports/update_manifest_contract_report.md
          if-no-files-found: warn

  installer-smoke:
    name: "Installer Smoke (${{ matrix.label }})"
    needs: signing-readiness
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos
            os: macos-latest
          - label: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run installer/update smoke pipeline
        working-directory: ./desktop
        env:
          STRICT_SIGNING_EXECUTION: ${{ inputs.enforce_signing_execution }}
          STRICT_SIGNING_PROVENANCE: ${{ inputs.enforce_signing_provenance }}
          STRICT_WINDOWS_INSTALLER_PACKAGING: ${{ inputs.enforce_windows_installer_packaging }}
          STRICT_WINDOWS_INSTALLER_EXECUTION: ${{ inputs.enforce_windows_installer_execution }}
          STRICT_WINDOWS_INSTALLER_NAMING: ${{ inputs.enforce_windows_installer_naming }}
          STRICT_WINDOWS_INSTALLER_PROVENANCE: ${{ inputs.enforce_windows_installer_provenance }}
          STRICT_WINDOWS_PROTOCOL_REGISTRATION: ${{ inputs.enforce_windows_protocol_registration }}
          PENJAR_MACOS_SIGN_IDENTITY: ${{ secrets.PENJAR_MACOS_SIGN_IDENTITY }}
          PENJAR_MACOS_TEAM_ID: ${{ secrets.PENJAR_MACOS_TEAM_ID }}
          PENJAR_MACOS_NOTARY_PROFILE: ${{ secrets.PENJAR_MACOS_NOTARY_PROFILE }}
          PENJAR_WINDOWS_CERT_PATH: ${{ secrets.PENJAR_WINDOWS_CERT_PATH }}
          PENJAR_WINDOWS_CERT_PASSWORD: ${{ secrets.PENJAR_WINDOWS_CERT_PASSWORD }}
          PENJAR_MACOS_SIGN_COMMAND: ${{ secrets.PENJAR_MACOS_SIGN_COMMAND }}
          PENJAR_MACOS_NOTARIZE_COMMAND: ${{ secrets.PENJAR_MACOS_NOTARIZE_COMMAND }}
          PENJAR_WINDOWS_SIGN_COMMAND: ${{ secrets.PENJAR_WINDOWS_SIGN_COMMAND }}
          PENJAR_WINDOWS_INSTALLER_COMMAND: ${{ secrets.PENJAR_WINDOWS_INSTALLER_COMMAND }}
          PENJAR_WINDOWS_INSTALLER_PROVENANCE_COMMAND: ${{ secrets.PENJAR_WINDOWS_INSTALLER_PROVENANCE_COMMAND }}
          PENJAR_WINDOWS_PROTOCOL_REGISTER_COMMAND: ${{ secrets.PENJAR_WINDOWS_PROTOCOL_REGISTER_COMMAND }}
          PENJAR_MACOS_SIGN_VERIFY_COMMAND: ${{ secrets.PENJAR_MACOS_SIGN_VERIFY_COMMAND }}
          PENJAR_WINDOWS_SIGN_VERIFY_COMMAND: ${{ secrets.PENJAR_WINDOWS_SIGN_VERIFY_COMMAND }}
        run: |
          set -eo pipefail
          ./scripts/release_installer_update_smoke.sh "${{ matrix.label }}" "${{ inputs.build_mode }}"

      - name: Upload installer smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installer-smoke-report-${{ matrix.label }}
          path: desktop/release/reports/installer_update_report_${{ matrix.label }}.json
          if-no-files-found: warn

      - name: Upload installer smoke archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installer-smoke-archive-${{ matrix.label }}
          path: desktop/release/reports/penjar-${{ matrix.label }}-${{ inputs.build_mode }}.zip
          if-no-files-found: warn

      - name: Upload signing pipeline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-signing-pipeline-report-${{ matrix.label }}
          path: desktop/release/reports/signing_report_${{ matrix.label }}.md
          if-no-files-found: warn

      - name: Upload signing provenance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-signing-provenance-report-${{ matrix.label }}
          path: desktop/release/reports/signing_artifact_provenance_${{ matrix.label }}.md
          if-no-files-found: warn

      - name: Upload Windows installer packaging report
        if: ${{ always() && matrix.label == 'windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-installer-packaging-report-${{ matrix.label }}
          path: desktop/release/reports/windows_installer_packaging_report.md
          if-no-files-found: warn

      - name: Upload Windows installer pipeline report
        if: ${{ always() && matrix.label == 'windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-installer-pipeline-report-${{ matrix.label }}
          path: desktop/release/reports/windows_installer_pipeline_report.md
          if-no-files-found: warn

      - name: Upload Windows installer provenance report
        if: ${{ always() && matrix.label == 'windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-installer-provenance-report-${{ matrix.label }}
          path: desktop/release/reports/windows_installer_provenance_report.md
          if-no-files-found: warn

      - name: Generate release evidence row snippet
        working-directory: ./desktop
        env:
          CI_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eo pipefail
          ./scripts/generate_release_evidence_row.sh \
            "release/reports/installer_update_report_${{ matrix.label }}.json" \
            "${{ inputs.rc_id }}" \
            "${CI_RUN_URL}" \
            "WS-D-43" \
            "blocked (unsigned smoke baseline)"

      - name: Generate release evidence bundle summary
        working-directory: ./desktop
        run: ./scripts/generate_release_evidence_bundle.sh "${{ matrix.label }}"

      - name: Check release evidence bundle summary
        working-directory: ./desktop
        env:
          STRICT_RELEASE_EVIDENCE_BUNDLE: ${{ inputs.enforce_release_evidence_bundle }}
        run: ./scripts/check_release_evidence_bundle.sh "${{ matrix.label }}"

      - name: Upload release evidence row snippet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-evidence-row-${{ matrix.label }}
          path: desktop/release/reports/release_evidence_row_${{ matrix.label }}.md
          if-no-files-found: warn

      - name: Upload release evidence bundle summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-evidence-bundle-${{ matrix.label }}
          path: desktop/release/reports/release_evidence_bundle_${{ matrix.label }}.md
          if-no-files-found: warn

      - name: Upload release evidence bundle check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-evidence-bundle-check-${{ matrix.label }}
          path: desktop/release/reports/release_evidence_bundle_check_${{ matrix.label }}.md
          if-no-files-found: warn

      - name: Generate release evidence index preview
        working-directory: ./desktop
        run: |
          set -eo pipefail
          ./scripts/update_release_evidence_index.sh \
            "release/reports/release_evidence_row_${{ matrix.label }}.md" \
            "../docs/technical-guide/developer/desktop-flutter-release-evidence-index.md" \
            "release/reports/release_evidence_index_preview_${{ matrix.label }}.md"

      - name: Upload release evidence index preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-evidence-index-preview-${{ matrix.label }}
          path: desktop/release/reports/release_evidence_index_preview_${{ matrix.label }}.md
          if-no-files-found: warn

  appcast-preview:
    name: "Appcast Preview"
    runs-on: ubuntu-latest
    needs: installer-smoke

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download installer smoke reports
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-installer-smoke-report-*
          merge-multiple: true
          path: desktop/release/reports

      - name: Generate appcast preview
        working-directory: ./desktop
        env:
          APPCAST_REQUIRE_BOTH_PLATFORMS: 1
        run: ./scripts/generate_appcast_from_reports.sh

      - name: Check appcast preview
        working-directory: ./desktop
        run: ./scripts/check_appcast.sh

      - name: Publish appcast dry-run targets
        working-directory: ./desktop
        run: ./scripts/publish_appcast.sh

      - name: Generate appcast publication bundle
        working-directory: ./desktop
        run: ./scripts/generate_appcast_publication_bundle.sh

      - name: Check appcast publication bundle
        working-directory: ./desktop
        run: ./scripts/check_appcast_publication_bundle.sh

      - name: Run appcast external production guard
        if: ${{ inputs.publish_appcast_external }}
        working-directory: ./desktop
        env:
          APPCAST_PUBLISH_PROVIDER: ${{ inputs.appcast_external_provider }}
          APPCAST_PUBLISH_DRY_RUN: ${{ inputs.appcast_external_dry_run }}
          ALLOW_APPCAST_EXTERNAL_PRODUCTION: ${{ inputs.allow_appcast_external_production }}
        run: ./scripts/guard_appcast_external_production.sh

      - name: Run appcast external readiness check
        if: ${{ inputs.publish_appcast_external }}
        working-directory: ./desktop
        env:
          STRICT_APPCAST_EXTERNAL_READINESS: ${{ inputs.enforce_appcast_external_readiness }}
          APPCAST_PUBLISH_PROVIDER: ${{ inputs.appcast_external_provider }}
          APPCAST_PUBLISH_DRY_RUN: ${{ inputs.appcast_external_dry_run }}
          ALLOW_APPCAST_EXTERNAL_PRODUCTION: ${{ inputs.allow_appcast_external_production }}
          APPCAST_S3_BUCKET: ${{ secrets.APPCAST_S3_BUCKET }}
          APPCAST_S3_PREFIX: ${{ vars.APPCAST_S3_PREFIX }}
          APPCAST_CACHE_INVALIDATION_COMMAND: ${{ secrets.APPCAST_CACHE_INVALIDATION_COMMAND }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_PROFILE: ${{ vars.AWS_PROFILE }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_WEB_IDENTITY_TOKEN_FILE: ${{ vars.AWS_WEB_IDENTITY_TOKEN_FILE }}
          APPCAST_EXTERNAL_IDENTITY_CHECK_COMMAND: ${{ secrets.APPCAST_EXTERNAL_IDENTITY_CHECK_COMMAND }}
          APPCAST_EXTERNAL_INVALIDATION_CHECK_COMMAND: ${{ secrets.APPCAST_EXTERNAL_INVALIDATION_CHECK_COMMAND }}
        run: ./scripts/check_appcast_external_readiness.sh

      - name: Publish appcast to external target
        if: ${{ inputs.publish_appcast_external }}
        working-directory: ./desktop
        env:
          APPCAST_PUBLISH_PROVIDER: ${{ inputs.appcast_external_provider }}
          APPCAST_PUBLISH_DRY_RUN: ${{ inputs.appcast_external_dry_run }}
          ALLOW_APPCAST_EXTERNAL_PRODUCTION: ${{ inputs.allow_appcast_external_production }}
          APPCAST_S3_BUCKET: ${{ secrets.APPCAST_S3_BUCKET }}
          APPCAST_S3_PREFIX: ${{ vars.APPCAST_S3_PREFIX }}
          APPCAST_CACHE_INVALIDATION_COMMAND: ${{ secrets.APPCAST_CACHE_INVALIDATION_COMMAND }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_PROFILE: ${{ vars.AWS_PROFILE }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_WEB_IDENTITY_TOKEN_FILE: ${{ vars.AWS_WEB_IDENTITY_TOKEN_FILE }}
        run: ./scripts/publish_appcast_external.sh

      - name: Upload appcast preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-appcast-preview
          path: desktop/release/reports/appcast_preview.json
          if-no-files-found: warn

      - name: Upload appcast published dry-run targets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-appcast-published-dry-run
          path: desktop/release/published/
          if-no-files-found: warn

