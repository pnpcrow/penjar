name: "Desktop Flutter CI"

on:
  pull_request:
    branches:
      - develop
      - staging
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "desktop/**"
      - "package.json"
      - ".github/workflows/tests-desktop-flutter.yml"
  push:
    branches:
      - develop
      - staging
      - main
    paths:
      - "desktop/**"
      - "package.json"
      - ".github/workflows/tests-desktop-flutter.yml"

concurrency:
  group: desktop-flutter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop-parity:
    name: "Desktop Flutter Parity (${{ matrix.label }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            os: ubuntu-latest
            include_build: 0
          - label: macos
            os: macos-latest
            include_build: 1
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run desktop verification chain
        working-directory: ./desktop
        run: INCLUDE_BUILD=${{ matrix.include_build }} ./scripts/verify_desktop.sh
