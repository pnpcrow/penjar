name: "Desktop Flutter CI"

on:
  pull_request:
    branches:
      - develop
      - staging
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "desktop/**"
      - "package.json"
      - ".github/workflows/tests-desktop-flutter.yml"
      - "docs/technical-guide/developer/desktop-flutter-release-validation-baseline.md"
      - "docs/technical-guide/developer/desktop-flutter-release-evidence-index.md"
      - "docs/technical-guide/developer/web-mcp-phase-c-execution-log.md"
  push:
    branches:
      - develop
      - staging
      - main
    paths:
      - "desktop/**"
      - "package.json"
      - ".github/workflows/tests-desktop-flutter.yml"
      - "docs/technical-guide/developer/desktop-flutter-release-validation-baseline.md"
      - "docs/technical-guide/developer/desktop-flutter-release-evidence-index.md"
      - "docs/technical-guide/developer/web-mcp-phase-c-execution-log.md"

concurrency:
  group: desktop-flutter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop-parity:
    name: "Desktop Flutter Parity (${{ matrix.label }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            os: ubuntu-latest
            include_build: 0
          - label: macos
            os: macos-latest
            include_build: 1
          - label: windows
            os: windows-latest
            include_build: 0
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run desktop verification chain
        working-directory: ./desktop
        run: |
          set -eo pipefail
          INCLUDE_BUILD=${{ matrix.include_build }} ./scripts/verify_desktop.sh | tee verify-${{ matrix.label }}.log

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verify-log-${{ matrix.label }}
          path: desktop/verify-${{ matrix.label }}.log

      - name: Upload verify stage timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verify-stage-timing-report-${{ matrix.label }}
          path: desktop/release/reports/verify_stage_timing_report.md
          if-no-files-found: warn

      - name: Upload release script syntax report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-script-syntax-report-${{ matrix.label }}
          path: desktop/release/reports/release_script_syntax_report.md
          if-no-files-found: warn

      - name: Upload release script syntax contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-script-syntax-contract-report-${{ matrix.label }}
          path: desktop/release/reports/release_script_syntax_contract_report.md
          if-no-files-found: warn

      - name: Upload verify test coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verify-test-coverage-report-${{ matrix.label }}
          path: desktop/release/reports/verify_test_coverage_report.md
          if-no-files-found: warn

      - name: Upload desktop command inventory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-command-inventory-report-${{ matrix.label }}
          path: desktop/release/reports/desktop_command_inventory_report.md
          if-no-files-found: warn

      - name: Upload desktop command inventory contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-command-inventory-contract-report-${{ matrix.label }}
          path: desktop/release/reports/desktop_command_inventory_contract_report.md
          if-no-files-found: warn

      - name: Upload update manifest validation report (verify matrix)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-update-manifest-validation-report-${{ matrix.label }}
          path: desktop/release/reports/update_manifest_validation_report.md
          if-no-files-found: warn

      - name: Upload release smoke gate policy contract report (verify matrix)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-smoke-gate-policy-contract-report-${{ matrix.label }}
          path: desktop/release/reports/release_smoke_gate_policy_contract_report.md
          if-no-files-found: warn

      - name: Upload release evidence index contract report (verify matrix)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-evidence-index-contract-report-${{ matrix.label }}
          path: desktop/release/reports/release_evidence_index_contract_report.md
          if-no-files-found: warn

      - name: Upload macOS debug app artifact
        if: matrix.label == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-debug-app
          path: desktop/build/macos/Build/Products/Debug/Penjar Desktop.app

  release-evidence-guard:
    name: "Desktop Release Evidence Guard"
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run release evidence guard
        working-directory: ./desktop
        run: ./scripts/check_release_evidence_index.sh

  release-update-manifest-guard:
    name: "Desktop Release Update Manifest Guard"
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run update manifest guard
        working-directory: ./desktop
        run: ./scripts/check_update_manifest.sh

      - name: Upload update manifest validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-update-manifest-validation-report
          path: desktop/release/reports/update_manifest_validation_report.md
          if-no-files-found: warn
