name: "Desktop Flutter CI"

on:
  pull_request:
    branches:
      - develop
      - staging
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "desktop/**"
      - "package.json"
      - ".github/workflows/tests-desktop-flutter.yml"
  push:
    branches:
      - develop
      - staging
      - main
    paths:
      - "desktop/**"
      - "package.json"
      - ".github/workflows/tests-desktop-flutter.yml"

concurrency:
  group: desktop-flutter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop-parity:
    name: "Desktop Flutter Parity"
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install desktop dependencies
        working-directory: ./desktop
        run: flutter pub get

      - name: Run desktop test suite
        working-directory: ./desktop
        run: flutter test --no-pub

      - name: Run desktop parity gates
        working-directory: ./desktop
        run: FLUTTER_NO_PUB=1 ./scripts/run_parity_tests.sh

      - name: Run desktop static analysis
        working-directory: ./desktop
        run: flutter analyze --no-pub
